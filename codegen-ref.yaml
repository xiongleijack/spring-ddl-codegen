# 生成层配置示例：codegen-polar-prd.yaml
# 命名规则：codegen-{实例名}.yaml，实例名中 _ 换 -

datasource: polar_data_prd

project:
  basePackage: com.example.spider
  author: xionglei
  database: dwd_bond

tables:
  - onshore_bond_filter_v5

templates:
  - do
  - mapper
  - dao
  - service
  - serviceImpl
  - mgtController
  - internalController
  - detailDto
  - queryDto
  - pageDto
  - queryBo
  - canalDTO
  - groupDo
  - groupMapper
  - groupDao

# onshore_bond_filter_v5 分组示例：按主体取最大发行起始日
groupDos:
  - className: OnshoreBondFilterV5ComUniCodeGroupDO
    comment: 按主体唯一编码分组
    sourceTable: onshore_bond_filter_v5
    # 有效数据过滤：只查未删除（deleted=0）；不配则不加该条件
    validFilter:
      field: deleted
      value: 0
    fields:
      - name: comUniCode
        type: Long
        comment: 主体唯一编码
      - name: maxIssueStartDate
        type: java.sql.Date
        column: max(issue_start_date)
        comment: 最晚发行起始日

options:
  businessKey: auto
  overwrite: true

stack:
  orm: mybatis-plus
  lombok: false
  swagger: true
