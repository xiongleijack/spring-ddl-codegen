project:
  basePackage: com.example.order
  author: xionglei
  database: bond_basic

# 方式一直接生成ddl语句进行读写
#ddl: sql/schema.sql

# 方式二数据源的读取方式
datasource:
  url: jdbc:mysql://localhost:3306/bond_basic?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  username: root
  password: root123
  tables:                    # 可选，不配则读取schema下所有表
    - onshore_bond_filter_v3

templates:
  - do
  - mapper
  - dao
  - service
  - serviceImpl
  - mgtController
  - detailDto
  - queryDto
  - pageDto
  - queryBo

options:
  businessKey: auto
  overwrite: true

stack:
  orm: mybatis-plus
  lombok: false
  swagger: true
